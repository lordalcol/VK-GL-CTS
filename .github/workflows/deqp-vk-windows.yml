# Builds deqp-vk for Windows x64 with the Visual Studio 2022 generator and MSVC,
# as a Visual Studio user does, and packages it with its data and the
# vk-default mustpass. Experiment for public issue 260.

name: deqp-vk Windows x64

on:
  push:
    tags:
      - 'vulkan-cts-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    permissions:
      contents: write   # only needed to attach the package to a release
    env:
      PKG: deqp-vk-windows-x64-${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch external sources
        run: |
          python --version
          python external/fetch_sources.py

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build deqp-vk
        run: |
          cmake --build build --config Release --target deqp-vk --parallel 4
          Get-PSDrive -PSProvider FileSystem

      - name: Package
        run: |
          $vk = "build/external/vulkancts/modules/vulkan"
          New-Item -ItemType Directory $env:PKG | Out-Null
          Copy-Item "$vk/Release/deqp-vk.exe" $env:PKG
          Copy-Item -Recurse "$vk/vulkan" $env:PKG
          Copy-Item -Recurse "$vk/vk-default" $env:PKG
          Copy-Item external/vulkancts/mustpass/main/vk-default.txt $env:PKG
          git rev-parse HEAD | Out-File -Encoding ascii "$env:PKG/COMMIT"
          7z a -tzip -mx=7 "$env:PKG.zip" $env:PKG | Out-Null
          Get-Item "$env:PKG.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
          archive: false
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.PKG }}.zip
